[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxyswitch"
version = "0.1.0"
description = "Local SOCKS5 router with switchable upstream proxies"
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["proxy", "socks5", "vpn", "wireguard", "networking"]
classifiers = [
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
]

[project.scripts]
proxyswitch = "proxyswitch.cli:main"

[project.gui-scripts]
proxyswitch-gui = "proxyswitch.gui:main"

[tool.setuptools]
packages = ["proxyswitch"]
